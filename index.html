<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sam Joyce Golf Day</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛳</text></svg>">
<style>
:root{--bg:#e3eedb;--cd:#fff;--ink:#16201a;--mu:#4b5b4f;--ac:#1d7a3c;--ai:#fff;--ln:#dbe3d8;--hl:#b45309;--ic:#2d7a3f;--bo:.22;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1511;--cd:#17221b;--ink:#e7efe9;--mu:#9aab9e;--ac:#3dbd69;--ai:#06130a;--ln:#25342a;--hl:#e5b04b;--ic:#7bd89a;--bo:.15;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1511;--cd:#17221b;--ink:#e7efe9;--mu:#9aab9e;--ac:#3dbd69;--ai:#06130a;--ln:#25342a;--hl:#e5b04b;--ic:#7bd89a;--bo:.15;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:var(--bo);color:var(--ic)}
.w{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.hd{display:flex;align-items:center;gap:12px;background:var(--ac);color:var(--ai);border-radius:14px;padding:12px 14px;margin:4px 0 12px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hd small{display:block;font-size:13px;opacity:.9}
h1{font-size:22px;margin:0}h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:20px 0 8px}h3{margin:0 0 8px;font-size:17px}
.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:10px 4px;border:1px solid var(--ln);background:var(--cd);color:var(--ink);border-radius:10px;font:inherit;font-weight:600}
.tabs .on{background:var(--ac);color:var(--ai);border-color:var(--ac)}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:8px 0}
.lb{display:flex;align-items:center;gap:12px}.rk{font-size:22px;min-width:34px;color:var(--ac)}.gn{flex:1;min-width:0}
.gn small,.sc small{display:block;color:var(--mu)}.sc{text-align:right}.sc b{font-size:24px}.hl{color:var(--hl)!important;font-weight:700}
.mu{color:var(--mu)}.err{color:var(--hl);margin:6px 0 0}
select,input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0}
.chip{flex:0 0 auto;min-width:40px;padding:9px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--ink);font:inherit}
.chip.done{border-color:var(--ac)}.chip.on{background:var(--ac);color:var(--ai);border-color:var(--ac);font-weight:700}
.drv{display:flex;flex-wrap:wrap;gap:6px}.lab{margin:10px 0 4px;color:var(--mu);font-size:14px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step b{font-size:32px}
.step button{width:64px;height:48px;font-size:26px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--ink)}
.go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--ai);font:inherit;font-weight:700;font-size:17px}.go:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sm{padding:6px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);color:var(--ink);font:inherit}
#mz{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
#mc{display:block;width:100%;border-radius:10px;margin:8px 0}
#mi{min-height:2.9em;margin:8px 0}
</style></head>
<body><svg class="bg" aria-hidden="true"><defs>
<symbol id="bl" viewBox="0 0 32 32"><circle fill="#fff" stroke="currentColor" stroke-width="2" cx="16" cy="16" r="14"/><g fill="currentColor"><circle cx="11" cy="12" r="1.7"/><circle cx="17" cy="9" r="1.7"/><circle cx="22" cy="14" r="1.7"/><circle cx="14" cy="17" r="1.7"/><circle cx="20" cy="21" r="1.7"/><circle cx="10" cy="22" r="1.7"/></g></symbol>
<symbol id="bt" viewBox="0 0 40 72"><use href="#bl" x="4" width="32" height="32"/><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M10 34h20l-5 8h-10zM18 42h4l-1 26h-2z"/></symbol>
<symbol id="cc" viewBox="0 0 100 100"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M22 10L78 86M78 10L22 86"/><ellipse fill="currentColor" cx="84" cy="88" rx="11" ry="5" transform="rotate(14 84 88)"/><ellipse fill="currentColor" cx="16" cy="88" rx="11" ry="5" transform="rotate(-14 16 88)"/></symbol>
<symbol id="fl" viewBox="0 0 40 72"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 6v58"/><path fill="currentColor" d="M12 6l22 8-22 8z"/><ellipse fill="none" stroke="currentColor" stroke-width="2.4" cx="12" cy="66" rx="10" ry="3.5"/></symbol>
<pattern id="p" width="260" height="260" patternUnits="userSpaceOnUse">
<use href="#bt" x="20" y="14" width="40" height="72" transform="rotate(-10 40 50)"/>
<use href="#cc" x="150" y="16" width="84" height="84"/>
<use href="#fl" x="26" y="150" width="40" height="72"/>
<use href="#bl" x="150" y="160" width="34" height="34"/>
<use href="#bl" x="214" y="118" width="22" height="22"/>
<use href="#bl" x="96" y="108" width="20" height="20"/>
<use href="#bt" x="104" y="170" width="28" height="50" transform="rotate(14 118 195)"/>
</pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>
<div class="w"><div class="hd"><svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#fff"/><g fill="#aebbb0"><circle cx="11" cy="12" r="1.7"/><circle cx="17" cy="9" r="1.7"/><circle cx="22" cy="14" r="1.7"/><circle cx="14" cy="17" r="1.7"/><circle cx="20" cy="21" r="1.7"/><circle cx="10" cy="22" r="1.7"/></g></svg><div><h1>Sam Joyce Golf Day</h1><small>Rowville Lakes Golf Course</small></div></div><div id="app"></div></div>
<input type="file" id="mf" accept="image/*" capture="environment" hidden>
<div id="mz" hidden><div class="w"><h3>Measure to the pin</h3><p class="mu">Stand over the hole and shoot straight down, with the ball and the hole both in the photo. Works best for balls within about 2 m. Pinch to zoom for more precise taps.</p><p id="mi" style="font-weight:700"></p><canvas id="mc"></canvas><p id="mr" style="font-size:24px;font-weight:700;margin:6px 0"></p><div class="row"><button class="sm" id="mb">Undo last tap</button><button class="sm" id="mx">Cancel</button></div><button class="go" id="mok" disabled>Use this distance</button></div></div>
<script>
const FB='https://sam-joyce-golf-tournament-default-rtdb.asia-southeast1.firebasedatabase.app/';
const H=18,MIN=2,AH='b3b1sk',PAR=[4,4,5,4,4,3,4,3,4,3,4,4,3,4,4,4,4,4];
const hh=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)};
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),M=er=>er.message||'try again';
let groups=[],me=null,tab='score',gid=null,hole=1,dr={s:4,p:2,d:null},cx={p:null,d:''},form={n:'',p:'',c:''},ef={n:'',p:[],c:''},ed=null,lf={u:'',p:''},msg='',del=null,busy=false,ready=false,slow=false,first=true,last,note='',jn=null;
try{me=JSON.parse(localStorage.getItem('sj'))}catch(_){}
try{gid=localStorage.getItem('gid')||null}catch(_){}
const sv=()=>{try{localStorage.setItem('sj',JSON.stringify(me))}catch(_){}},adm=()=>!!me&&me.r==='a';
if(me)tab=adm()?'setup':'score';
const cur=()=>groups.find(g=>g.id===(adm()?gid:me&&me.id)),ck=()=>hole===10?'np':hole===18?'ld':'',dv=n=>PAR[n-1]>3;
const hs=g=>{const a=[];for(let i=1;i<=H;i++)if(g['h'+i])a.push({n:i,...g['h'+i]});return a};
const tot=g=>{const a=hs(g);return{n:a.length,s:a.reduce((t,x)=>t+x.s,0),p:a.reduce((t,x)=>t+x.p,0)}};
const dc=g=>g.players.map((n,i)=>({n,c:hs(g).filter(x=>x.d===i&&dv(x.n)).length})),sh=g=>dc(g).filter(x=>x.c<MIN);
function load(){const g=cur(),x=g&&g['h'+hole],c=g&&g[ck()];dr=x?{s:x.s,p:x.p,d:x.d==null?null:x.d}:{s:PAR[hole-1],p:2,d:null};cx=c?{p:c.p,d:String(c.d)}:{p:null,d:''}}
function rows(){
 const a=groups.map(g=>({g,m:sh(g),...tot(g)})),f=a.filter(x=>x.n>=H).sort((x,y)=>x.s-y.s||x.p-y.p);
 f.forEach((x,i)=>{x.r=i&&x.s===f[i-1].s&&x.p===f[i-1].p?f[i-1].r:i+1;x.t=f.some(y=>y!==x&&y.s===x.s&&y.p===x.p);x.b=f.some(y=>y!==x&&y.s===x.s&&y.p!==x.p)});
 return{f,ip:a.filter(x=>x.n<H).sort((x,y)=>y.n-x.n||x.s-y.s)}}
const card=(x,fin)=>`<div class="cd lb">${fin?`<b class="rk">${x.t?'T':''}${x.r}</b>`:''}<div class="gn"><b>${E(x.g.name)}</b><small>${fin?x.g.players.map(E).join(', '):'Thru '+x.n+' of '+H}</small>${fin&&x.m.length?`<small class="hl">Min drives: ${x.m.map(y=>E(y.n)+' '+y.c+'/'+MIN).join(', ')}</small>`:''}</div>${fin||adm()?`<div class="sc"><b>${x.s}</b><small${x.b?' class="hl"':''}>${x.p} putts</small></div>`:''}</div>`;
const best=(k,d)=>groups.filter(g=>g[k]&&typeof g[k].d==='number').map(g=>({g,...g[k]})).sort((a,b)=>d*(a.d-b.d))[0];
const ct=(l,k,d)=>{const b=best(k,d);return `<div class="cd row"><div><b>${l}</b><div class="mu">${b?E(b.g.players[b.p]||'?')+' · '+E(b.g.name):'No entries yet'}</div></div><b>${b?(b.d<1?Math.round(b.d*100)+' cm':b.d+' m'):''}</b></div>`};
const gr=g=>g.id===ed?`<div class="cd"><h3>Edit group</h3><input id="en" placeholder="Group name" value="${E(ef.n)}">${ef.p.map((p,i)=>`<input id="ep${i}" placeholder="Player ${i+1}" value="${E(p)}">`).join('')}<input id="ec" inputmode="numeric" maxlength="4" placeholder="4-digit passcode" value="${E(ef.c)}"><button class="go" data-a="es">Save changes</button><button class="sm" data-a="ec" style="margin-top:10px">Cancel</button><p class="err">${E(msg)}</p></div>`:`<div class="cd row"><div><b>${E(g.name)}</b><div class="mu">${g.players.map(E).join(', ')}</div><div class="mu">Passcode: ${E(g.pin||'not set')}</div></div><div class="drv"><button class="sm" data-a="iv" data-id="${g.id}">Invite</button><button class="sm" data-a="e" data-id="${g.id}">Edit</button><button class="sm" data-a="x" data-id="${g.id}">${del===g.id?'Confirm?':'Delete'}</button></div></div>`;
const loginView=()=>`<div class="cd"><h3>Log in</h3><div class="lab">Username</div><select id="lu"><option value="">Choose your group…</option><option value="admin"${lf.u==='admin'?' selected':''}>Admin</option>${groups.map(g=>`<option value="${g.id}"${lf.u===g.id?' selected':''}>${E(g.name)}</option>`).join('')}</select><div class="lab">Passcode</div><input id="lp" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4-digit passcode" value="${E(lf.p)}"><button class="go" data-a="login">Log in</button><p class="err">${E(msg)}</p></div>`;
function view(){
 let h='';
 if(!ready)return '<p class="mu">'+(slow?'Still trying to reach the scores…':'Loading…')+'</p>';
 if(!me)return loginView();
 if(tab==='board'){
  if(!adm()&&!(cur()&&cur().h18))return '<div class="cd"><h3>Leaderboard locked</h3><p class="mu">It unlocks as soon as you submit hole 18.</p></div>';
  const{f,ip}=rows();
  h+='<h2>Final standings</h2>'+(f.length?f.map(x=>card(x,1)).join(''):'<p class="mu">Groups are ranked here once all '+H+' holes are entered.</p>');
  if(f.some(x=>x.b))h+='<p class="mu">Highlighted putts broke a tie on strokes.</p>';
  h+='<h2>Contests</h2>'+ct('Nearest the pin · hole 10','np',1)+ct('Longest drive · hole 18','ld',-1);
  if(ip.length)h+='<h2>Still playing</h2>'+ip.map(x=>card(x,0)).join('')}
 else if(tab==='score'){
  const g=cur();
  if(adm())h+='<select id="gs"><option value="">Choose a group…</option>'+groups.map(x=>`<option value="${x.id}"${x.id===gid?' selected':''}>${E(x.name)}</option>`).join('')+'</select>';
  if(!g)return h+'<p class="mu">'+(adm()?'Choose a group to enter scores.':'Group not found.')+'</p>';
  const t=tot(g),k=ck(),d=dc(g),need=d.reduce((a,x)=>a+Math.max(0,MIN-x.c),0),left=PAR.filter((p,i)=>p>3&&!g['h'+(i+1)]).length,
   st=(l,q)=>`<div class="lab">${l}</div><div class="step"><button data-a="d" data-k="${q}">−</button><b>${dr[q]}</b><button data-a="u" data-k="${q}">+</button></div>`;
  h+='<div class="chips">'+Array.from({length:H},(_,i)=>i+1).map(n=>`<button class="chip${n===hole?' on':''}${g['h'+n]?' done':''}" data-a="h" data-n="${n}">${n}</button>`).join('')+'</div>';
  h+=`<div class="cd"><h3>Hole ${hole} · Par ${PAR[hole-1]}</h3>${st('Group score (best ball)','s')}${st('Putts','p')}${dv(hole)?`<div class="lab">Who drove?</div><div class="drv">${g.players.map((p,i)=>`<button class="chip${dr.d===i?' on':''}" data-a="v" data-i="${i}">${E(p)}</button>`).join('')}</div>`:'<p class="mu">Par 3: no driver needed.</p>'}<button class="go" data-a="save"${busy?' disabled':''}>${g['h'+hole]?'Update':'Save'} hole ${hole}</button><p class="err">${E(msg)}</p></div>`;
  if(k)h+=`<div class="cd"><h3>${k==='np'?'Nearest the pin':'Longest drive'} · hole ${hole}</h3><div class="lab">Best in your group</div><div class="drv">${g.players.map((p,i)=>`<button class="chip${cx.p===i?' on':''}" data-a="cp" data-i="${i}">${E(p)}</button>`).join('')}</div><div class="lab">Distance (m)</div><input id="cd" type="number" inputmode="decimal" step="any" min="0" value="${E(cx.d)}">${k==='np'?'<button class="sm" data-a="cam">Measure with camera</button>':''}<button class="go" data-a="cs"${busy?' disabled':''}>Save entry</button>${g[k]?'<button class="sm" data-a="cc" style="margin-top:10px">Clear entry</button>':''}</div>`;
  h+=`<p class="mu">${t.n}/${H} holes · ${t.s} strokes · ${t.p} putts</p><div class="lab">Drives on par 4s and 5s (minimum ${MIN} each)</div><div class="drv">${d.map(x=>`<span class="chip${x.c<MIN?' hl':''}">${E(x.n)} ${x.c}/${MIN}</span>`).join('')}</div>`;
  if(need&&need>=left)h+=`<p class="err">${need>left?'Minimum drives can no longer be met.':'No spare holes: each remaining drive must come from a player still short.'}</p>`}
 else if(adm()){
  h+=`<div class="cd"><h3>Add a group</h3><input id="gn" placeholder="Group name" value="${E(form.n)}"><input id="gp" placeholder="Players, comma separated (3–4)" value="${E(form.p)}"><input id="gc" inputmode="numeric" maxlength="4" placeholder="4-digit passcode" value="${E(form.c)}"><button class="go" data-a="add">Add group</button><p class="err">${E(msg)}</p></div>`;
  h+='<h2>Groups</h2>'+(note?'<p class="mu">'+E(note)+'</p>':'')+(groups.length?groups.map(gr).join(''):'<p class="mu">No groups yet.</p>')}
 return h}
function render(){
 const t=me?(adm()?[['board','Leaderboard'],['score','Score'],['setup','Groups']]:[['score','Score'],['board','Leaderboard']]):[];
 $('#app').innerHTML=(me?`<div class="row" style="margin:0 0 10px"><span class="mu">Signed in as <b>${adm()?'Admin':E((cur()||{}).name||'')}</b></span><button class="sm" data-a="lo">Log out</button></div>`:'')+(t.length?'<div class="tabs">'+t.map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="t" data-k="${k}">${l}</button>`).join('')+'</div>':'')+view()}
function login(){
 const p=lf.p.trim();lf.p='';
 if(!lf.u||!/^\d{4}$/.test(p)){msg='Choose a username and enter your 4-digit passcode.';return render()}
 if(lf.u==='admin'){if(hh('sjgd'+p)!==AH){msg='Wrong passcode.';return render()}me={r:'a'};tab='setup'}
 else{const g=groups.find(x=>x.id===lf.u);if(!g||!g.pin||g.pin!==p){msg=g&&!g.pin?'No passcode is set for this group. Ask the admin.':'Wrong passcode.';return render()}me={r:'g',id:g.id,p:g.pin};tab='score'}
 msg='';lf.u='';sv();hole=1;load();render()}
async function invite(g){
 if(!g.pin){note='Set a passcode for '+g.name+' first (Edit).';return render()}
 const url=location.href.split('#')[0]+'#join='+g.id+'.'+g.pin,
 text='You’re invited to the Sam Joyce Golf Day at Rowville Lakes Golf Course!\nGroup: '+g.name+'\nPasscode: '+g.pin+'\nOne person per group enters the scores. Tap to open the app:\n'+url;
 if(navigator.share){try{await navigator.share({title:'Sam Joyce Golf Day',text});return}catch(er){if(er.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(text);note='Invitation for '+g.name+' copied. Paste it into a message.'}catch(_){prompt('Copy this invitation',text)}
 render()}
function joinHash(){const m=/^#join=([\w-]+)\.(\d{4})$/.exec(location.hash);if(!m)return;jn={id:m[1],p:m[2]};try{history.replaceState(null,'',location.href.split('#')[0])}catch(_){}}
function tryJoin(){if(!jn)return;const g=groups.find(x=>x.id===jn.id);
 if(g&&g.pin&&g.pin===jn.p){me={r:'g',id:g.id,p:g.pin};tab='score';hole=1;sv();msg='';load()}
 else{msg='That invitation is no longer valid. Log in with your passcode.';if(g)lf.u=g.id}
 jn=null}
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,D=b.dataset;if(a!=='iv')note='';
 if(a==='t'){tab=D.k;msg='';del=null}
 else if(a==='lo'){me=null;sv();msg='';tab='score'}
 else if(a==='login')return login();
 else if(a==='h'){hole=+D.n;load();msg=''}
 else if(a==='d'||a==='u'){const k=D.k,m=k==='s'?1:0,X=k==='s'?15:dr.s;dr[k]=Math.max(m,Math.min(X,dr[k]+(a==='u'?1:-1)));if(dr.p>dr.s)dr.p=dr.s}
 else if(a==='v')dr.d=+D.i;
 else if(a==='cam')return $('#mf').click();
 else if(a==='cp')cx.p=+D.i;
 else if(a==='save'){const g=cur();if(!g||busy)return;
  if(dv(hole)&&dr.d==null)msg='Select who drove before saving.';
  else{busy=true;render();try{const o={s:dr.s,p:dr.p};if(dv(hole))o.d=dr.d;await S.upd(g.id,{['h'+hole]:o});msg='';if(hole<H){hole++;load()}else tab='board'}catch(er){msg='Could not save: '+M(er)}busy=false}}
 else if(a==='cs'){const g=cur(),k=ck(),v=parseFloat(cx.d);if(!g||!k||busy)return;
  if(cx.p==null||!isFinite(v)||v<0)msg='Select a player and enter the distance in metres.';
  else{busy=true;render();try{await S.upd(g.id,{[k]:{p:cx.p,d:v}});msg=''}catch(er){msg='Could not save: '+M(er)}busy=false}}
 else if(a==='cc'){const g=cur(),k=ck();if(g&&k)try{await S.upd(g.id,{[k]:null});cx={p:null,d:''}}catch(er){msg='Could not clear: '+M(er)}}
 else if(a==='add'){const n=form.n.trim(),p=form.p.split(',').map(s=>s.trim()).filter(Boolean),c=form.c.trim();
  if(!n||p.length<3||p.length>4)msg='Enter a group name and 3 to 4 players, separated by commas.';
  else if(!/^\d{4}$/.test(c))msg='The passcode must be 4 digits.';
  else if(n.toLowerCase()==='admin'||groups.some(g=>g.name.toLowerCase()===n.toLowerCase()))msg='That group name is already taken.';
  else try{await S.add({name:n,players:p,pin:c,created:Date.now()});form={n:'',p:'',c:''};msg=''}catch(er){msg='Could not add: '+M(er)}}
 else if(a==='iv'){const g=groups.find(x=>x.id===D.id);if(g)return invite(g)}
 else if(a==='e'){const g=groups.find(x=>x.id===D.id);if(g){ed=g.id;ef={n:g.name,p:[...g.players],c:g.pin||''};msg='';del=null}}
 else if(a==='ec'){ed=null;msg=''}
 else if(a==='es'){const n=ef.n.trim(),p=ef.p.map(s=>s.trim()),c=ef.c.trim();
