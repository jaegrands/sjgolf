<!DOCTYPE html>
<!-- Sam Joyce Golf Day build (V1 database) - Rowville Lakes Golf Course scoring app. One file, plain JavaScript, no build step.
Consolidated from the whole V2 development chat (27 Nov 2026).
DATABASE: https://sam-joyce-golf-tournament-default-rtdb.asia-southeast1.firebasedatabase.app/  (Firebase Realtime Database, REST, 5 second polling)
  Rules to publish: groups, players and holes each need ".read": true and ".write": true.
  /groups  name, players[], pids[], rk[] ranks, mb[] member flags, wn[] previous-win years, pin, h1..h18, np, ld
  /players player pool: name, rank 1-4, member true/false, wins[] (years won)
  /holes   /holes/<n> = aerial image + tee box and green shapes + scale; /holes/_settings/hc = shared Handicap on/off
BROWSER STORAGE KEYS: sj1_sj, sj1_gid, sj1_gtee, sj1_rr  (login, selected group, GPS tee mark, ranking-rules toggle)
FEATURES
  Login: group dropdown + 4-digit passcode. Admin creates/edits/deletes groups, sets passcodes, sends invitation links, scores any group, resets scores.
  Scoring: shots, putts, whose drive (par 4s and 5s, minimum 2 each), men's par 69 card, all distances in metres.
  Contests: nearest the pin on hole 10 (camera, 108 mm hole as scale) and longest drive on hole 18 (GPS tee to ball).
  Leaderboard: strokes (net when Handicap is On) then fewer putts; shown after hole 18; trophy names (Members only) for the winners; previous winners show trophies with years.
  Players tab (admin): add/edit/delete, rank 1-4, Member/Guest, previous wins, spreadsheet upload with downloadable template, one-tap import of the member list.
  Groups tab (admin): 4 player slots whose choices narrow to the allowed rank combinations; Group ranking rules toggle (one 1, a 1 needs a 4,
    no two 2s with a 1, at most two 2s, at least 2 Members); total ranking, Par-Group and handicap (1 stroke per point above the Par-Group);
    Handicap toggle (On = net scores; Off = still shown but not applied).
  Holes tab and the bottom of the Score tab: par, distance in metres, contest notes, and the admin-uploaded aerial image with draggable tee box
    and green shapes, a 100 m or 150 m scale line, and a full-screen tap-to-measure view.
-->

:root{--bg:#e3eedb;--cd:#fff;--ink:#16201a;--mu:#4b5b4f;--ac:#1d7a3c;--ai:#fff;--ln:#dbe3d8;--hl:#b45309;--ic:#2d7a3f;--bo:.22;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:var(--bo);color:var(--ic)}
.w{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.hd{display:flex;align-items:center;gap:12px;background:var(--ac);color:var(--ai);border-radius:14px;padding:8px 14px;margin:4px 0 12px;box-shadow:0 2px 8px rgba(0,0,0,.18)}

.tabs{display:flex;gap:6px}.tabs button{flex:1;padding:10px 4px;border:1px solid var(--ln);background:var(--cd);color:var(--ink);border-radius:10px;font:inherit;font-weight:600}
.tabs .on{background:var(--ac);color:var(--ai);border-color:var(--ac)}
.tabs.t4 button{font-size:13px;padding:10px 2px}

.hov{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease}.hov.show{opacity:1;transform:none}.hgw{display:block;overflow:hidden;border-radius:10px;max-width:360px;margin:10px auto 0}.hg{width:100%;display:block}
#ov{position:fixed;left:0;top:0;right:0;bottom:0;z-index:60;background:var(--cd);color:var(--ink);display:none;flex-direction:column}.edt{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid var(--ln)}.edw{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:#000}.edi{position:relative;line-height:0}.edi img{width:100%;display:block}.edi svg{position:absolute;left:0;top:0;width:100%;height:100%}.edf{padding:10px 12px;font-size:14px;line-height:1.4;border-top:1px solid var(--ln)}.cd .edi{max-width:420px;margin:8px auto}.te{touch-action:none}.edi svg *{pointer-events:none}@media (prefers-reduced-motion:reduce){.hov{opacity:1;transform:none;transition:none}}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:8px 0}
.lb{display:flex;align-items:center;gap:12px}.rk{font-size:22px;min-width:34px;color:var(--ac)}.gn{flex:1;min-width:0}
.gn small,.sc small{display:block;color:var(--mu)}.sc{text-align:right}.sc b{font-size:24px}.hl{color:var(--hl)!important;font-weight:700}
.mu{color:var(--mu)}.err{color:var(--hl);margin:6px 0 0}
select,input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0}
.chip{flex:0 0 auto;min-width:40px;padding:9px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--ink);font:inherit}
.chip.done{border-color:var(--ac)}.chip.on{background:var(--ac);color:var(--ai);border-color:var(--ac);font-weight:700}
.drv{display:flex;flex-wrap:wrap;gap:6px}.lab{margin:10px 0 4px;color:var(--mu);font-size:14px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px}.step b{font-size:32px}
.step button{width:64px;height:48px;font-size:26px;border:1px solid var(--ln);border-radius:10px;background:var(--cd);color:var(--ink)}
.go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--ai);font:inherit;font-weight:700;font-size:17px}.go:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sm{padding:6px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);color:var(--ink);font:inherit}
#mz{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
#mc{display:block;width:100%;border-radius:10px;margin:8px 0}
#mi{min-height:2.9em;margin:8px 0}
.hd img{width:64px;height:64px;flex:0 0 auto}
#hero,#hsub{display:none}
.lg .hd{display:none}
.lg #hero{display:block;margin:4px auto 8px;width:min(100%,44vh);aspect-ratio:1;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.2);background:#19402e}
.lg #hsub{display:block;text-align:center;margin:0 0 6px;color:var(--mu);font-weight:600}
</style></head>
